# CI for the AI website builder.
# Verifies the frontend type-checks and builds on every push / MR.

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

stages:
  - verify

typecheck:
  stage: verify
  script:
    - npx tsc --noEmit

build:
  stage: verify
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
