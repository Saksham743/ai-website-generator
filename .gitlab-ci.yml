# CI for the AI website builder.
# Verifies the frontend type-checks and builds on every push / MR.

default:
  image: node:22

stages:
  - verify

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.install: &install
  - npm ci --cache .npm --prefer-offline

typecheck:
  stage: verify
  script:
    - *install
    - npx tsc --noEmit

build:
  stage: verify
  script:
    - *install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
